name: skill71-parity

# Skill 71 cross-repo parity (fix plan Fix 10). The two repositories drifted
# in files their own allowlist classifies as byte-identical, and the parity
# block skipped by default because nothing set SKILL71_999_ROOT.
#
# The step below runs the shipped verify.sh with BOTH roots named, so its
# parity block reports [PASS] or [FAIL] and never [SKIP]. verify.sh resolves
# its repository as "$ROOT/../.." and looks for
# scripts/check-skill71-parity.py in it; in the onboarding repository the
# skill sits one level below the root, so the step exposes it one level
# deeper through a symlink. The expression then names the real checkout root
# and the checker compares the two real trees. No file bytes are copied or
# changed.
#
# Extended gate (CON-09, CON-06, CON-08). Beyond Skill 71 this one workflow
# also judges the rest of the launch family and the GHL pack files that Skill
# 71's pack manifest carries for Skills 44 (convert-and-flow-operator) and 38
# (conversational-ai-system), so a red check means real drift on any of
# Skills 49, 83, 78-82, 6, 44, 50, 38 or 71. Mark this workflow's `parity` job
# as a required status check on main in the repository branch-protection
# settings; that setting lives in GitHub, not in this file. The job runs on
# every pull request (no path filter) because it is the required check: a
# required check behind a PR path filter never reports on PRs that skip those
# paths, and GitHub holds them at "Expected - waiting" forever.

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/blackceo-signature-page/**'
      - '.claude/skills/black-friday-launcher/**'
      - '.claude/skills/signature-funnel/**'
      - '.claude/skills/signature-product-selection/**'
      - '.claude/skills/signature-order-form/**'
      - '.claude/skills/signature-upsell/**'
      - '.claude/skills/signature-downsell/**'
      - '.claude/skills/signature-thank-you/**'
      - '.claude/skills/ghl-install-pages/**'
      - '.claude/skills/convert-and-flow-operator/**'
      - '.claude/skills/conversational-ai-system/**'
      - '.claude/skills/email-engine/**'
      - 'shared-utils/signature_launch/**'
      - 'shared-utils/client_intake/**'
      - 'shared-utils/signature_launch_contract/**'
      - 'shared-utils/kie_prompt_enforcer.py'
      - 'scripts/check-skill71-parity.py'
      - 'scripts/check-launch-family-parity.py'
      - 'scripts/qc-assert-skill-frontmatter-version.sh'
      - 'DIST-02-PACKAGING-MANIFEST.json'
      - '.github/workflows/skill71-parity.yml'
  pull_request:
  schedule:
    # openclaw-onboarding moves without a commit here, so it also runs on a clock
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      SKILL71_999_ROOT: ${{ github.workspace }}/999-checkout
      SKILL71_ONB_ROOT: ${{ github.workspace }}/onboarding-checkout
    steps:
      - name: Checkout 999-setup (this repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: 999-checkout
      - name: Checkout trevorotts1/openclaw-onboarding (the sync source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: trevorotts1/openclaw-onboarding
          ref: main
          path: onboarding-checkout
      - name: Skill 71 parity reports PASS or FAIL, never SKIP
        run: |
          set -uo pipefail
          test -n "$SKILL71_999_ROOT" || { echo "SKILL71_999_ROOT unset" >&2; exit 1; }
          test -n "$SKILL71_ONB_ROOT" || { echo "SKILL71_ONB_ROOT unset" >&2; exit 1; }

          # verify.sh computes its repository as "$ROOT/../.." and expects
          # scripts/check-skill71-parity.py there. The onboarding skill sits
          # one level below the checkout root, so expose it one level deeper
          # through a symlink; verify.sh then names the real root. The checker
          # also reads <root>/shared-utils/ (tracked files), so both of those
          # ride along: without them verify.sh prints [FAIL] parity for want
          # of a script, which is not a parity verdict at all.
          mkdir -p "$SKILL71_ONB_ROOT/.ci"
          ln -sfn "$SKILL71_ONB_ROOT/71-blackceo-signature-page" \
                  "$SKILL71_ONB_ROOT/.ci/71-blackceo-signature-page"
          ln -sfn "$SKILL71_ONB_ROOT/scripts" \
                  "$SKILL71_ONB_ROOT/.ci/scripts"
          ln -sfn "$SKILL71_ONB_ROOT/shared-utils" \
                  "$SKILL71_ONB_ROOT/.ci/shared-utils"

          log="$RUNNER_TEMP/skill71-verify.log"
          rc=0
          bash "$SKILL71_ONB_ROOT/.ci/71-blackceo-signature-page/verify.sh" \
            2>&1 | tee "$log" || rc=$?

          # The parity verdict decides this step. verify.sh also runs the skill
          # test suite as a side effect; wiring that suite into CI is Fix 11,
          # a different unit, so its result is printed but not judged here.
          if grep -q '^\[PASS\] parity against .* checkout ' "$log"; then
            exit 0
          fi
          if grep -q '^\[FAIL\] parity against .* checkout ' "$log"; then
            echo "Skill 71 cross-repo parity FAILED (verify.sh exit $rc)" >&2
            exit 1
          fi
          echo "Skill 71 parity printed neither PASS nor FAIL (verify.sh exit $rc)" >&2
          exit 1

      - name: Skill 71 checker run directly (exit 0 required)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 "$SKILL71_999_ROOT/scripts/check-skill71-parity.py" \
            --onb-root "$SKILL71_ONB_ROOT" --nine-root "$SKILL71_999_ROOT"

      - name: Launch-family parity (49, 83, 78-82, 6, 44, 50 and 71)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 "$SKILL71_999_ROOT/scripts/check-launch-family-parity.py" \
            --onboarding "$SKILL71_ONB_ROOT" --nine "$SKILL71_999_ROOT"

      - name: DIST-02 manifest generator self-test
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd "$SKILL71_999_ROOT"
          python3 .claude/skills/black-friday-launcher/scripts/generate_dist02_manifest.py --self-test

      - name: DIST-02 packaging manifest is current
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd "$SKILL71_999_ROOT"
          python3 .claude/skills/black-friday-launcher/scripts/generate_dist02_manifest.py --check

      # Last on purpose: a full run writes bytecode and run files into the Skill 49 tree,
      # which the DIST-02 tree hash above must not see.
      - name: Skill 49 entry self-test
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The self-test needs Skill 22 (persona registry) and Skill 74 (KIE prompt
          # budget adapter). 999 ships neither, so expose the sync source's copies in
          # the installed layout ($HOME/.openclaw/skills) that the Skill 49 scripts search.
          mkdir -p "$HOME/.openclaw/skills"
          for d in 22-book-to-persona-coaching-leadership-system 74-kie-live-adapter; do
            ln -sfn "$SKILL71_ONB_ROOT/$d" "$HOME/.openclaw/skills/$d"
          done
          cd "$SKILL71_999_ROOT"
          bash .claude/skills/signature-funnel/signature-funnel-entry.sh --self-test
