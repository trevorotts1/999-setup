name: kaizen-tests

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/kaizen/**'
      - '.claude/skills/eli5/**'
      - '.claude/skills/bro/**'
      - '.claude/skills/nine-router-setup/**'
      - '.claude/skills/spec-protocol/**'
      - 'CONTROL/bundled-skills.txt'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '.claude/skills/kaizen/**'
      - '.claude/skills/eli5/**'
      - '.claude/skills/bro/**'
      - '.claude/skills/nine-router-setup/**'
      - '.claude/skills/spec-protocol/**'
      - 'CONTROL/bundled-skills.txt'
      - 'THIRD_PARTY_NOTICES.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unix-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run all Kaizen test suites
        run: bash .claude/skills/kaizen/tests/run-all-kaizen-tests.sh
      - name: nine-router-setup skills-only mode (fake HOME; fails if any 9Router path is written)
        run: bash .claude/skills/nine-router-setup/tests/test-skills-only.sh
      - name: claude-nine launcher fleet-safety (loopback bind, key file, prefix, installer --check)
        run: bash .claude/skills/nine-router-setup/tests/test-launcher-safe.sh

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run PowerShell self-test (fixtures only)
        shell: pwsh
        run: ./.claude/skills/kaizen/scripts/windows/kaizen-task-self-test.ps1
      - name: Run static + structural checks
        shell: bash
        run: bash .claude/skills/kaizen/tests/fix09-windows-notes.sh
