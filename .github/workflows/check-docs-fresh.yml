name: check-docs-fresh

on:
  push:
    branches: [main, "batch/**"]
    tags: ['v*', 'nine-router-setup-v*']
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTROL/bundled-components.json'
      - '.claude/skills/*/VERSION'
      - 'scripts/check-docs-fresh.sh'
      - 'scripts/test-check-docs-fresh.sh'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTROL/bundled-components.json'
      - '.claude/skills/*/VERSION'
      - 'scripts/check-docs-fresh.sh'
      - 'scripts/test-check-docs-fresh.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-fresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: README / VERSION / latest-tag agreement
        run: bash scripts/check-docs-fresh.sh
      - name: Self-test — the checker must actually discriminate
        run: bash scripts/test-check-docs-fresh.sh
