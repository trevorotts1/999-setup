name: drama-song-tests

# Skill 75 (drama-song-ad-factory) CI: every scripts/core test_*.py under a
# fresh empty HOME (manual 02 B6), numpy so the singing-detector suite really
# runs, the F17 and B6 static checks, the layout parity test and the W4 proof run.

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/drama-song-ad-factory/**'
      - '.github/workflows/drama-song-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.claude/skills/drama-song-ad-factory/**'
      - '.github/workflows/drama-song-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  drama-song:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      SKILL: .claude/skills/drama-song-ad-factory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install numpy + opencv (singing-detector and book_shot suites need them)
        run: python3 -m pip install --quiet numpy opencv-python-headless pytest
      - name: Install ffmpeg + tesseract (mp3 fixtures; book_shot title OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - name: Static checks (F17 no local ASR, B6 operator-path leak)
        run: |
          bash "$SKILL/scripts/qc-no-local-asr.sh"
          bash "$SKILL/scripts/qc-operator-path-leak.sh"
      - name: Every scripts/core test_*.py under a fresh empty HOME
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r t; do
            h="$(mktemp -d)"
            if ! (HOME="$h" python3 "$t" </dev/null); then echo "FAIL (empty HOME): $t"; rc=1; fi
          done < <(find "$SKILL/scripts/core" -type f -name 'test_*.py' -not -path '*/__pycache__/*' | sort)
          [ "$rc" -eq 0 ]
      - name: Skill 75 pytest collection + run (no hidden failures)
        shell: bash
        run: |
          set -uo pipefail
          # Unit TESTHYG-75: a module-level sys.exit made the whole-tree pytest
          # run INTERNALERROR and hid every failure after it. Collection and a
          # full run over scripts/ are now red builds of their own.
          HOME="$(mktemp -d)" python3 -m pytest -q "$SKILL/scripts" --collect-only
          HOME="$(mktemp -d)" python3 -m pytest -q "$SKILL/scripts"
          echo "✓ Skill 75 scripts/ pytest-collectable and green"
      - name: Skill tests + layout parity test (empty HOME)
        run: HOME="$(mktemp -d)" python3 -m pytest -q "$SKILL/tests"
      - name: Every $SKILL/tests script that pytest cannot collect (empty HOME)
        shell: bash
        run: |
          set -uo pipefail
          # Some tests here are SCRIPT-style (top-level asserts, no test_ class or
          # function): `pytest -q $SKILL/tests` imports and discards them, so a red
          # one is invisible. Run every file that pytest collects nothing from.
          rc=0
          n=0
          # Runner entry points each carry the minimal legal invocation their
          # own argparse requires (a bare run argparse-errors before anything
          # checks):
          #
          #   install_fixtures/harness.py -> --self-check. No ONB candidate is
          #     reachable here (this repo carries no onboarding layout and the
          #     runner has no ~/openclaw-onboarding), so the harness prints its
          #     own named "resolve-failure: no candidate for ..." line and
          #     exits 2 — EXIT_TOOLING, "nothing ran, never a silent pass".
          #     Exactly that line + exit 2 = expected skip, reason echoed;
          #     any other line or exit = real failure.
          #   test_install_fixtures.py -> same resolve-failure contract
          #     (docstring: "2 = a candidate could not be resolved (nothing
          #     was checked — never reported as a pass)"); DSAF_N999_CANDIDATE
          #     is unset in this dispatch, so it exits 2 before checking.
          #   story_first_acceptance/run_acceptance.py -> --out at a fresh
          #     path (its only required argument). scripts/core/compatibility.py
          #     (S75-T28) is an upstream onboarding module this repository
          #     does not carry, so both facets report their paid_compatibility
          #     cell BLOCKED_DEPENDENCY and exit 1 — cell_matrix.py:580 names
          #     the exact path and the owning task. The skip accepts ONLY that
          #     exact shape: both facet lines "(8 pass / 0 fail / 1 blocked of
          #     9)", both cell rows naming compatibility.py, four
          #     BLOCKED_DEPENDENCY lines total. Any other blocked count, any
          #     FAIL, any different missing path stays a real failure.
          #   test_clean_install_discovery.py -> DSAF_ALLOW_ABSENT_HELPERS=1
          #     (below): this repo distributes only two helper symlinks, so
          #     the test file's own env marker turns absent-helper matrix rows
          #     into printed SKIP rows and the nine-helper preflight plus her
          #     hermetic controls skip with named reasons. A tree that ships
          #     every helper is never gated by the marker (a shipped install
          #     fails exactly as before), and every factory and packaging row
          #     still runs here.
          #   test_x11_install_gate.py / test_x11_preserve_contract_parity.py
          #     -> the mirrors skip THEMSELVES where install.sh and
          #     update-skills.sh are absent from the skills root:
          #     pytest.skip(CALL_SITE_REASON, allow_module_level=True), exit 1
          #     with the traceback line "Skipped: install.sh/update-skills.sh
          #     are not shipped at ... in this repository; the S75-X11
          #     call-site proof runs where they exist". Accept only that line.
          while IFS= read -r t; do
            if HOME="$(mktemp -d)" python3 -m pytest -q "$t" --collect-only 2>/dev/null | grep -qE '^[0-9]+ (test|item)'; then
              continue
            fi
            h="$(mktemp -d)"
            extra=()
            envs=()
            case "$t" in
              */install_fixtures/harness.py) extra=(--self-check) ;;
              */story_first_acceptance/run_acceptance.py) extra=(--out "$h") ;;
              */test_clean_install_discovery.py) envs=(DSAF_ALLOW_ABSENT_HELPERS=1) ;;
            esac
            n=$((n+1))
            code=0
            out="$(HOME="$h" env "${envs[@]}" python3 "$t" "${extra[@]}" </dev/null 2>&1)" || code=$?   # captured before anything else can reset it
            if [ "$code" -ne 0 ]; then
              if [ "$t" = "$SKILL/tests/story_first_acceptance/run_acceptance.py" ] \
                 && [ "$(grep -c 'BLOCKED_DEPENDENCY' <<<"$out")" -eq 4 ] \
                 && [ "$(grep -cE '^(onboarding|999): BLOCKED_DEPENDENCY  \(8 pass / 0 fail / 1 blocked of 9\)' <<<"$out")" -eq 2 ] \
                 && [ "$(grep -c 'scripts/core/compatibility.py' <<<"$out")" -ge 2 ]; then
                echo "SKIP (script's own named dependency outcome: paid_compatibility BLOCKED_DEPENDENCY, compatibility.py/S75-T28 absent from this tree): $t"
              elif [ "$t" = "$SKILL/tests/install_fixtures/harness.py" -o "$t" = "$SKILL/tests/test_install_fixtures.py" ] \
                 && [ "$code" -eq 2 ] \
                 && grep -q '^resolve-failure: ' <<<"$out"; then
                echo "SKIP (script's own named resolve-failure, exit 2 — nothing ran, never a silent pass): $t"
                grep '^resolve-failure: ' <<<"$out"
              elif [ "$t" = "$SKILL/tests/test_x11_install_gate.py" -o "$t" = "$SKILL/tests/test_x11_preserve_contract_parity.py" ] \
                 && grep -q 'Skipped: install.sh/update-skills.sh are not shipped at .* in this repository; the S75-X11 call-site proof runs where they exist' <<<"$out"; then
                echo "SKIP (mirror's own module-level CALL_SITE_REASON skip — installers absent from this layout): $t"
                grep 'Skipped: install.sh/update-skills.sh' <<<"$out"
              else
                echo "FAIL (script, empty HOME, rc=$code): $t"
                echo "$out" | tail -8
                rc=1
              fi
            elif [ "$t" = "$SKILL/tests/test_clean_install_discovery.py" ] && grep -q '^SKIP: ' <<<"$out"; then
              # State the gated rows so the skip is never silent.
              echo "SKIP (DSAF_ALLOW_ABSENT_HELPERS=1, repo distributes no full helper set): $t"
              grep '^SKIP: ' <<<"$out"
            fi
          done < <(find "$SKILL/tests" -type f -name '*.py' -not -path '*/__pycache__/*' | sort)
          echo "script-style test files run: $n"
          [ "$rc" -eq 0 ]
      - name: W4 proof run (19 stages, zero network, zero spend)
        run: HOME="$(mktemp -d)" python3 "$SKILL/scripts/proof_run/run_proof.py"
