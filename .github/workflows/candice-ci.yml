# candice-ci.yml — Candice Companion cross-platform CI/release matrix
#
# Owned class: .github/workflows/** (PROJECT-MANIFEST 9.4 item 4 — global CI,
# non-partitionable; integration/release owner applies).
#
# CI semantics are FIX-021-owned (required steps, determinism). This is the
# applied repair, not a proposal.
#
# Matrix (CHECKLIST E.1 WS-46):
#   - macOS Apple Silicon job: full app build (Tauri 2), TypeScript check,
#     cargo tests across the four standalone crates (capture, permissions,
#     binding/macos, binding/windows) + signature-helper crate, all 14
#     Candice test suites, platform verifiers, the WS-45 performance gate
#     (after the Tauri release bundle build — build-before-measure), and the
#     determinism rerun matrix.
#   - Windows x64 job: WASAPI capture build, Win32 binding build, parity
#     engine unit tests, native Windows parity + shell-compat verifiers.
#
# FIX-021 semantics (enforced by scripts/candice-ci/check-workflow.mjs,
# which runs as a step here — the workflow validates itself):
#   - Required verifiers have NO continue-on-error. A required check that
#     cannot run is a FAILURE (exit nonzero), never a silent skip. Host-class
#     checks the runner cannot provide exit 0 as explicit BLOCKED rows with a
#     machine-readable reason; the release gate refuses evidence missing the
#     expected BLOCKED rows.
#   - Every third-party action is pinned to a full commit SHA. The Rust
#     toolchain is pinned to 1.97.1 (rustc evidence: CONTROL/SESSION-LOG.md),
#     never floating `stable`. npm ci against the committed lockfile, never
#     npm install.
#   - Build before measure: the Tauri release bundle build runs before the
#     WS-45 performance suite, which runs with
#     --require-bundle "apps/candice-companion/src-tauri/target/release/bundle/macos/Candice Companion.app"
#     (the real product name; see tauri.conf.json productName).
#   - Evidence uploads: perf report, verifier logs, cargo test output,
#     commit-sha, and the determinism evidence record are uploaded as
#     artifacts on every run.
#   - Current-commit proof: every required job writes
#     `git rev-parse HEAD > commit-sha.txt` and uploads it.
#   - Two clean reruns: the determinism job runs the required suites twice on
#     fresh runners (no cache steps), uploads both report sets, and the
#     comparator fails on any required-result divergence.
#
# Gated, not run here: the interactive Windows 10/11 desktop smoke
# (apps/candice-companion/tests/windows-shell-compat/INTERACTIVE-WINDOWS-SMOKE.md
# — Windows Terminal + PS 5.1/PS 7/CMD + standalone console hosts, both
# `claude` and `claude-nine.cmd`, tabs/panes, mic, PTT, transparency,
# minimize/restore/monitor move, install/update/uninstall cleanup) requires a
# real interactive Windows desktop session that CI cannot provide; it is
# recorded as GATED and run by hand. Windows classification rule (FIX-021):
# Windows is NON-PRODUCTION until the `windowsSigningAndInteractiveSmoke`
# required gate is PASS in CONTROL/release-gate.json. The
# interactive-windows-gate job is explicitly non-blocking: it records
# nothing into a release verdict and can never satisfy that gate. Any
# release claiming Windows production without it is refused by
# scripts/candice-release/status.mjs (which scans this file and refuses any
# continue-on-error: true).

name: candice-ci

on:
  push:
    paths:
      - 'apps/candice-companion/**'
      - 'packages/candice-protocol/**'
      - 'plugins/candice-integration/**'
      - 'scripts/candice-*/**'
      - 'tests/**'
      - 'tools/windows-parity/**'
      - 'launchers/**'
      - '.github/workflows/candice-ci.yml'
  pull_request:
    paths:
      - 'apps/candice-companion/**'
      - 'packages/candice-protocol/**'
      - 'plugins/candice-integration/**'
      - 'scripts/candice-*/**'
      - 'tests/**'
      - 'tools/windows-parity/**'
      - 'launchers/**'
      - '.github/workflows/candice-ci.yml'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # macOS Apple Silicon — reference platform (spec 0.3)
  # ---------------------------------------------------------------------------
  macos-arm64:
    name: macOS Apple Silicon — build + all Candice suites
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Verify arm64 host
        run: |
          [ "$(uname -m)" = "arm64" ] || { echo "FAIL: expected arm64 runner"; exit 1; }
          echo "host $(uname -s) $(uname -m)"

      - name: App frontend build + tsc + vite (npm ci, committed lockfile)
        run: |
          cd apps/candice-companion
          npm ci
          npm run build

      # Required: no continue-on-error. Host-class checks the runner cannot
      # provide exit 0 as explicit BLOCKED rows; a FAIL exits nonzero and
      # blocks the job.
      - name: macOS platform verifier (tests/macos/verify-macos.sh, CI mode)
        run: |
          bash tests/macos/verify-macos.sh --ci-root "$RUNNER_TEMP/candice-verify-home" > verifier-macos.log 2>&1
          cat verifier-macos.log

      # --- 14 Candice test suites (plain node, zero deps) ---
      - name: WS-41 contract suite
        run: node tests/contract/suite.js
      - name: WS-33 checksums + bundled components suite
        run: node --test "scripts/candice-updater/checksums/__tests__/*.test.mjs"
      - name: WS-31 bootstrap suite
        run: node --test "scripts/candice-bootstrap/__tests__/*.test.mjs"
      - name: WS-33 rollback suite
        run: node --test "scripts/candice-updater/rollback/__tests__/*.test.mjs"
      - name: WS-49 installer/updater regression suite
        run: node --test "tests/installer-regression/*.test.mjs"
      - name: WS-47 upgrade fixtures suite
        run: node --test tests/upgrade-fixtures/*.test.mjs
      - name: WS-32 candice-upgrade suite
        run: node --test "scripts/candice-upgrade/__tests__/*.test.mjs"
      - name: WS-43 failure/chaos matrix suite
        run: node tests/failure-matrix/suite.js
      - name: WS-50 e2e acceptance suite
        run: node tests/e2e-acceptance/suite.js
      - name: WS-34 migrations suite
        run: node --test tests/migrations/migrations.test.ts
      - name: WS-42 same-session suite
        run: node tests/same-session/suite.js
      - name: WS-44 privacy/security audit
        run: node tests/privacy-audit/run.js

      - name: Tauri release bundle build (macOS, unsigned)
        run: |
          cd apps/candice-companion
          npm run tauri:build

      # Build-before-measure (FIX-021): the perf gate runs only after the
      # bundle build above and asserts the built bundle exists, recording its
      # SHA-256 in the report.
      - name: WS-45 performance suite (measure + threshold gate)
        env:
          CANDICE_PERF_IDLE_MS: 3000
          CANDICE_PERF_ENGINE_MS: 3000
          CANDICE_PERF_INTERVAL_MS: 300
        run: node tests/performance/run.mjs --quick --require-bundle "apps/candice-companion/src-tauri/target/release/bundle/macos/Candice Companion.app"

      - name: Interview R5 shape check (fixtures + selfcheck)
        run: |
          node tests/interview/r5-shape-check.mjs --selfcheck
          node tests/interview/r5-shape-check.mjs --fixtures-dir tests/interview/fixtures

      - name: Terminal-compat CI suites (WS-25)
        run: |
          cd apps/candice-companion
          node --test tests/terminal-compat/integration.test.ts
          node --test tests/terminal-compat/launcher-analysis.test.ts

      - name: Cargo tests — app shell crate
        run: cargo test --manifest-path apps/candice-companion/src-tauri/Cargo.toml > cargo-test-output.log 2>&1
      - name: Cargo tests — capture crate (WS-17)
        run: cargo test --manifest-path apps/candice-companion/src-tauri/audio/capture/Cargo.toml >> cargo-test-output.log 2>&1
      - name: Cargo tests — permissions crate (WS-22)
        run: cargo test --manifest-path apps/candice-companion/src-tauri/permissions/Cargo.toml >> cargo-test-output.log 2>&1
      - name: Cargo tests — binding/macos crate (WS-21)
        run: cargo test --manifest-path apps/candice-companion/src-tauri/binding/macos/Cargo.toml >> cargo-test-output.log 2>&1
      - name: Cargo tests — binding/windows crate (WS-26, platform-neutral logic)
        run: cargo test --manifest-path apps/candice-companion/src-tauri/binding/windows/Cargo.toml >> cargo-test-output.log 2>&1
      - name: Cargo tests — signature-helper crate (WS-23)
        run: cargo test --manifest-path apps/candice-companion/scripts/package-macos/signature-helper/Cargo.toml >> cargo-test-output.log 2>&1
      - name: Packaging self-test (WS-23, offline)
        run: bash apps/candice-companion/scripts/package-macos/self-test.sh

      # The workflow validates itself: the structural checker (plain
      # JavaScript, no network, no clock) fails on any required-job
      # continue-on-error, unpinned action, loose dependency install, or
      # missing determinism/upload/commit-evidence wiring in this
      # repository's workflow files.
      - name: Workflow self-validation (FIX-021 structural check)
        run: node scripts/candice-ci/check-workflow.mjs --root .

      - name: Current-commit evidence
        run: git rev-parse HEAD > commit-sha.txt
      - name: Upload evidence (perf report, verifier log, cargo log, commit sha)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-report
          path: tests/performance/reports/perf-*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-macos
          path: verifier-macos.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-test-output
          path: cargo-test-output.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commit-sha
          path: commit-sha.txt

  # ---------------------------------------------------------------------------
  # Windows x64 — WASAPI capture build + parity + shell-compat
  # ---------------------------------------------------------------------------
  windows-x64:
    name: Windows x64 — capture + parity + shell-compat
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Verify Windows x64 host
        shell: pwsh
        run: |
          if ($env:OS -ne 'Windows_NT') { Write-Host 'FAIL: expected Windows host'; exit 1 }
          Write-Host "matrix: $env:OS on $env:PROCESSOR_ARCHITECTURE"

      - name: Cargo tests — capture-windows crate (WS-28, WASAPI backend)
        shell: pwsh
        run: cargo test --manifest-path apps/candice-companion/src-tauri/audio/capture-windows/Cargo.toml --features wasapi
      - name: Cargo tests — capture crate (WS-17, cpal feature)
        shell: pwsh
        run: cargo test --manifest-path apps/candice-companion/src-tauri/audio/capture/Cargo.toml --features cpal
      - name: Cargo tests — binding/windows crate (WS-26, win32 feature)
        shell: pwsh
        run: cargo test --manifest-path apps/candice-companion/src-tauri/binding/windows/Cargo.toml --features win32
      - name: Cargo check — app workspace for x64 (no run)
        shell: pwsh
        run: cargo check --manifest-path apps/candice-companion/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: windows-parity unit tests (WS-27 golden guard)
        shell: pwsh
        run: node tools/windows-parity/tests/parity-tests.mjs
      - name: Parity shell matrix verifier (WS-27)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows-parity/shell-matrix/verify-shell-matrix.ps1

      # Required: no continue-on-error (FIX-021). CI mode provisions fixture
      # state under the runner temp dir; host-class checks the runner cannot
      # provide exit 0 as explicit BLOCKED rows.
      - name: Windows platform verifier (tests/windows/verify-windows.ps1, CI mode)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows/verify-windows.ps1 -StateDir "$env:RUNNER_TEMP\candice-verify-state" *> verifier-windows.log
          Get-Content verifier-windows.log

      - name: Windows shell-compat verifier (WS-27, CI mode)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/candice-companion/tests/windows-shell-compat/verify-windows-shell-compat.ps1 -StateDir "$env:RUNNER_TEMP\candice-shell-compat-state" *> verifier-windows-shell-compat.log
          Get-Content verifier-windows-shell-compat.log

      - name: Current-commit evidence
        shell: pwsh
        run: git rev-parse HEAD > commit-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-windows
          path: verifier-windows.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-shell-compat
          path: verifier-windows-shell-compat.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commit-sha
          path: commit-sha.txt

  # ---------------------------------------------------------------------------
  # Determinism matrix (FIX-021): two clean reruns of the required suites,
  # fresh runners, no cache steps. Required: any required-result divergence
  # or missing leg between the shards fails the compare job below.
  # ---------------------------------------------------------------------------
  determinism:
    needs: [macos-arm64, windows-x64]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: determinism rerun shard ${{ matrix.shard }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Tauri release bundle build (build-before-measure)
        run: |
          cd apps/candice-companion
          npm ci
          npm run tauri:build

      # Fresh-runner rerun of the release-blocking suites. Log lines must be
      # identical across shards (no shard index, no timestamps) so the
      # comparator sees the same legs in both runs.
      - name: Run required suites (shard ${{ matrix.shard }})
        run: |
          bash tests/macos/verify-macos.sh --ci-root "$RUNNER_TEMP/candice-verify-home" > determinism-run.log 2>&1 || echo "FAIL  macOS platform verifier" >> determinism-run.log
          node --test "scripts/candice-upgrade/__tests__/*.test.mjs" >> determinism-run.log 2>&1 || echo "FAIL  WS-32 candice-upgrade suite" >> determinism-run.log
          node --test tests/upgrade-fixtures/*.test.mjs >> determinism-run.log 2>&1 || echo "FAIL  WS-47 upgrade fixtures suite" >> determinism-run.log
          node tests/privacy-audit/run.js >> determinism-run.log 2>&1 || echo "FAIL  WS-44 privacy/security audit" >> determinism-run.log
          node tests/performance/run.mjs --quick --require-bundle "apps/candice-companion/src-tauri/target/release/bundle/macos/Candice Companion.app" >> determinism-run.log 2>&1 || echo "FAIL  WS-45 performance suite" >> determinism-run.log
          echo "PASS  determinism required suites complete" >> determinism-run.log
          tail -n 30 determinism-run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: determinism-run-shard-${{ matrix.shard }}
          path: determinism-run.log

  determinism-compare:
    name: determinism comparator
    needs: determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: determinism-run-shard-1
          path: ci-reports/run-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: determinism-run-shard-2
          path: ci-reports/run-2
      - name: Current-commit evidence
        run: git rev-parse HEAD > commit-sha.txt
      - name: Compare determinism reruns
        run: node scripts/candice-ci/compare-runs.mjs --sha "$(cat commit-sha.txt)" --run ci-reports/run-1 ci-reports/run-2 | tee determinism-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: determinism-evidence
          path: determinism-evidence.json

  # ---------------------------------------------------------------------------
  # WS-46 interactive Windows desktop gate — GATED, manual, non-blocking
  # ---------------------------------------------------------------------------
  # Windows is NOT labeled production-ready until at least one interactive
  # Windows 10/11 desktop run completes
  # apps/candice-companion/tests/windows-shell-compat/INTERACTIVE-WINDOWS-SMOKE.md
  # (Windows Terminal + PS 5.1/PS 7/CMD, standalone console hosts, both
  # `claude` and `claude-nine.cmd`, tabs/panes, mic, PTT, transparency,
  # minimize/restore/monitor move, install/update/uninstall cleanup). CI hosts
  # cannot run it: it needs a physical PC or interactive VM under a real
  # desktop session.
  #
  # FIX-021 classification rule: this job is explicitly NON-BLOCKING. It
  # records nothing into a release verdict and can never satisfy the
  # `windowsSigningAndInteractiveSmoke` required gate — that gate only turns
  # PASS from a recorded interactive desktop run, and
  # scripts/candice-release/status.mjs keeps windowsProduction false until
  # then.
  interactive-windows-gate:
    name: WS-46 interactive Windows smoke — GATED (manual, non-blocking)
    runs-on: windows-latest
    if: false
    steps:
      - run: echo "GATED — interactive Windows desktop smoke requires a real host; run manually"

  # A release tag must not become a publishable Candice release unless the
  # repository's fail-closed authority accepts the exact tagged checkout.
  # The companion release workflow calls the same command before it creates
  # a GitHub Release or uploads any artifact. --root pins the authority to
  # the workspace checkout (FIX-021; check-workflow.mjs enforces it).
  release-authority:
    name: Candice release authority
    if: startsWith(github.ref, 'refs/tags/candice-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Refuse unverified release candidate
        run: node scripts/candice-release/status.mjs --root $GITHUB_WORKSPACE
