<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Candice</title>
  </head>
  <body>
    <div id="app">
      <!-- Boot surface (present before the first paint of src/main.ts) -->
      <div class="boot" role="status" aria-live="polite">
        <span class="boot-glow" aria-hidden="true"></span>
        <p id="candice-boot-status" class="candice-status-surface" data-status="starting">Starting Candice…</p>
      </div>
      <!--
        Gesture stage host (FIX-016). Empty until mountGestureStage fills
        it with canonical manifest layers; it is invisible on first paint,
        so it can never render placeholder or generated art.
      -->
      <div
        id="candice-gesture-stage"
        class="candice-character"
        data-candice-gesture-stage
        data-candice-state="starting"
        aria-hidden="true"
      ></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
