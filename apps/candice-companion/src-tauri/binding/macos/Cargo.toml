# WS-21 macOS terminal-window discovery/binding — Candice Companion.
#
# Owned by WR-015 lane (ownership map 9.2):
#   apps/candice-companion/src-tauri/binding/macos/**
#
# Standalone crate so the unit is buildable/testable independently of the
# WR-012-owned app Cargo.toml. The run integration owner (9.3) wires this
# path into the app crate at fan-in.
#
# Accessibility (AXUIElement) and the permission prompt are NOT this
# crate's job: spec 17 says "use native macOS window/accessibility APIs as
# required" and the Accessibility-denied fallback path is owned by WR-015 /
# WS-22 (permissions lane). This crate reads the public window-server
# metadata API only — passive, no prompt, no TCC dialog of its own.
#
# Default feature set is empty: `cargo test` needs no network and no
# Screen Recording permission. The pure discovery/binding logic and the
# CoreGraphics parsing (owner name / PID / bounds / layer via
# kCGWindow* keys) are exercised fully by the test suite on fixture data.
# `live-probe` is the opt-in feature that actually calls
# CGWindowListCopyWindowInfo; it is used by the bin/ probe tool and by
# CI smoke tests on real Mac hardware (and requires Screen Recording /
# Accessibility for the frontmost check — see README).

[package]
name = "candice-macos-binding"
version = "0.1.0"
edition = "2021"
description = "WS-21 macOS terminal-window discovery/binding (Candice Companion)"
publish = false

[features]
default = []
live-probe = ["dep:core-graphics", "dep:core-foundation"]

[dependencies]
core-foundation = { version = "0.10", optional = true }
core-graphics = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.test]
opt-level = 0
