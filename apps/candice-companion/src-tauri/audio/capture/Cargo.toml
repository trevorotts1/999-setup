# WS-17 local microphone capture + push-to-talk — Candice Companion.
#
# Owned by WR-014 lane (ownership map 9.2): apps/candice-companion/src-tauri/audio/capture/**
# Standalone crate so the unit is buildable/testable independently of the WR-012-owned
# app Cargo.toml. The run integration owner (9.3) wires this path into the app crate
# at fan-in; the cpal feature is the platform audio plumbing (spec 18 boundary).
#
# Default feature set is empty: `cargo test` needs no downloads and no audio
# hardware. Enable `cpal` to compile the real device source.

[package]
name = "candice-capture"
version = "0.1.0"
edition = "2021"
description = "WS-17 local microphone capture + push-to-talk (Candice Companion)"
publish = false

[features]
default = []
cpal = ["dep:cpal"]

[dependencies]
cpal = { version = "0.18", optional = true }

[profile.test]
opt-level = 0
