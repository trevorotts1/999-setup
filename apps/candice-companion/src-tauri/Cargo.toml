[package]
name = "candice-companion"
version = "1.0.0-rc.1"
description = "Candice Companion — local visual and voice companion for Claude Code skills"
authors = ["BlackCEO"]
edition = "2021"

# The shell must never block the session: no panics across the bridge, no
# unbounded allocations, no background threads that outlive the app.
[lib]
name = "candice_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
