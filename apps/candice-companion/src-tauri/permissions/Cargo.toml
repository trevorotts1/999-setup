# WS-22 macOS permissions + degraded floating mode — Candice Companion.
#
# Owned by WR-015 lane (ownership map 9.2):
#   apps/candice-companion/src-tauri/permissions/**
#
# Standalone crate so the unit is buildable/testable independently of the
# WR-012-owned app Cargo.toml. The run integration owner (9.3) wires this
# path into the app crate at fan-in.
#
# Scope (Master Spec 0E WS-22, sections 0.3 / 17 / 20):
#   - request Accessibility/microphone permissions in plain language only
#     when needed;
#   - fall back to an independent movable floating Candice when
#     Accessibility permission is denied;
#   - Claude never stops (spec 20 failure doctrine).
#
# This crate OWNS the permission-status model and the degraded floating
# mode policy. It never triggers a TCC prompt of its own: prompts are the
# app layer's UX job (the crate returns status + the exact plain-language
# copy the app should show). WS-21 (binding/macos) owns window discovery
# and anchor geometry; this crate consumes a `None`-confidence window
# match as the signal to switch to floating mode.
#
# Default feature set is empty: `cargo test` needs no network and no TCC
# permission. `live` is the opt-in feature that links the real macOS
# frameworks (ApplicationServices AXIsProcessTrusted, CoreGraphics screen
# capture preflight, AVFoundation microphone status). It is used by the
# example diagnostic and by CI smoke tests on real Mac hardware.
#
# Live probes are read-only: AXIsProcessTrusted (no prompt), CGPreflight*
# (no prompt), AVCaptureDevice authorizationStatus (no prompt). No API in
# this crate ever calls an interactive TCC request (AXIsProcessTrustedWithOptions
# with prompt=true, AVCaptureDevice requestAccess, CGRequestScreenCaptureAccess)
# — those belong to the app layer which owns the plain-language UX.

[package]
name = "candice-macos-permissions"
version = "0.1.0"
edition = "2021"
description = "WS-22 macOS permissions + degraded floating mode (Candice Companion)"
publish = false

[features]
default = []
live = [
    "dep:core-graphics",
    "dep:objc2",
    "dep:objc2-foundation",
]

[dependencies]
core-graphics = { version = "0.25", optional = true }
objc2 = { version = "0.6", features = ["std", "exception", "catch-all"], optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSValue", "NSObject"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 0

[[example]]
name = "status"
required-features = ["live"]
